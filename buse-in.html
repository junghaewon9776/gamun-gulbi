<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>부세 입고 보내기 · 가문굴비</title>
<!-- 🐟 거래처 → 가문 부세 입고 양식 (로그인 없음). /busePub/{시즌} 에 '보내기만' — 읽기·고치기는 가문 직원만 (DB 규칙) -->
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#ecfeff;color:#0f172a}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.hd{background:linear-gradient(135deg,#0e7490,#155e75);color:#fff;border-radius:14px;padding:18px 16px;margin-bottom:12px}
.hd h1{margin:0;font-size:21px}.hd p{margin:4px 0 0;font-size:13px;opacity:.9}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
label{display:block;font-size:13px;font-weight:700;color:#334155;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;font-family:inherit;background:#fff}
.line{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.line select{flex:1.3}.line input{flex:1}
.x{background:#dc2626;color:#fff;border:none;border-radius:8px;width:40px;height:44px;font-size:16px;flex:none}
.btn{border:none;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;width:100%}
.add{background:#0e7490;margin-top:4px}.send{background:#16a34a;font-size:17px;padding:15px}
.send:disabled{background:#94a3b8}
.tot{text-align:right;font-size:14px;margin-top:6px;color:#334155}
.ok{text-align:center;padding:30px 10px}.ok b{font-size:22px;color:#16a34a;display:block;margin-bottom:8px}
.err{color:#dc2626;font-size:13px;margin-top:8px;min-height:16px}
.mut{color:#64748b;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><h1>🐟 부세 입고 보내기</h1><p>가문굴비로 보낸 날짜 · 품목 · 수량을 적어 주세요 <span id="seasonTxt"></span></p></div>
  <div id="form">
    <div class="card">
      <label>보낸 날 (가문 도착일)</label><input id="dt" type="date">
      <label>거래처 (보내는 곳) · 이름</label><input id="from" list="froms" placeholder="예: 대영물산" maxlength="40"><datalist id="froms"></datalist>
      <label>차량번호 · 기사님 연락처 (선택)</label><input id="car" placeholder="예: 12가 3456 / 010-..." maxlength="40">
    </div>
    <div class="card">
      <label style="margin-top:0">품목 · 수량 (개)</label>
      <div id="lines"></div>
      <button class="btn add" onclick="addLine()">+ 품목 줄 추가</button>
      <div class="tot" id="tot"></div>
    </div>
    <div class="card">
      <label style="margin-top:0">메모 (선택)</label><textarea id="memo" rows="2" maxlength="200" placeholder="예: 31미 일부 크기 작음"></textarea>
      <label>거래명세서 · 송장 사진 (선택)</label><input id="photo" type="file" accept="image/*" capture="environment" onchange="pickPhoto(this)">
      <img id="pv" style="display:none;max-width:100%;margin-top:8px;border-radius:8px">
    </div>
    <button class="btn send" id="sendBtn" onclick="send()">📨 가문굴비로 보내기</button>
    <div class="err" id="err"></div>
    <div class="mut" style="text-align:center;margin-top:8px">보낸 내용은 가문굴비 직원이 실제 받은 수량을 확인해서 넣어요.</div>
  </div>
  <div id="done" class="card ok" style="display:none"><b>✅ 보냈어요</b><div id="doneTxt"></div><button class="btn add" style="margin-top:16px" onclick="location.reload()">또 보내기</button></div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
var CFG = null, PHOTO = "";
function today(){ var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function opts(){ return '<option value="">품목 고르기</option>' + ((CFG && CFG.items) || []).map(function(i){ return '<option value="' + esc(i.k) + '">' + esc(String(i.k).replace(/·[\d_]+kg$/, "")) + (i.kg ? ' · ' + esc(i.kg) + 'kg' : '') + (i.nm ? ' (' + esc(i.nm) + ')' : '') + '</option>'; }).join("") + '<option value="__etc">기타 (직접 적기)</option>'; }
function addLine(){
  var d = document.createElement("div"); d.className = "line";
  d.innerHTML = '<select onchange="if(this.value===\'__etc\'){var v=prompt(\'품목 (예: 27미)\');if(v){var o=document.createElement(\'option\');o.value=o.textContent=v.trim().slice(0,20);this.insertBefore(o,this.lastChild);this.value=o.value}else this.value=\'\'}calc()">' + opts() + '</select><input type="number" inputmode="numeric" min="0" placeholder="수량" oninput="calc()"><button class="x" onclick="this.parentNode.remove();calc()">✕</button>';
  document.getElementById("lines").appendChild(d);
}
function lines(){ return Array.prototype.map.call(document.querySelectorAll(".line"), function(l){ return { item: l.querySelector("select").value, qty: Number(l.querySelector("input").value) || 0 }; }).filter(function(x){ return x.item && x.item !== "__etc" && x.qty > 0; }); }
function calc(){ var L = lines(), t = L.reduce(function(a, x){ return a + x.qty; }, 0); document.getElementById("tot").textContent = L.length ? "합계 " + L.length + "품목 · " + t.toLocaleString("ko-KR") + "개" : ""; }
function pickPhoto(inp){
  var f = inp.files && inp.files[0]; if(!f) return;
  var u = URL.createObjectURL(f), img = new Image();
  img.onload = function(){
    var r = Math.min(1, 1400 / Math.max(img.width, img.height)), cv = document.createElement("canvas"); cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r);
    var x = cv.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, cv.width, cv.height); x.drawImage(img, 0, 0, cv.width, cv.height);
    var q = .75, d = cv.toDataURL("image/jpeg", q); while(d.length > 400000 && q > .3){ q -= .1; d = cv.toDataURL("image/jpeg", q); }
    PHOTO = d; var pv = document.getElementById("pv"); pv.src = d; pv.style.display = "block"; URL.revokeObjectURL(u);
  };
  img.src = u;
}
function send(){
  var e = document.getElementById("err"); e.textContent = "";
  if(!CFG || !CFG.season) return e.textContent = "아직 준비 중이에요 — 잠시 후 다시 열어 주세요";
  var v = { dt: document.getElementById("dt").value, from: document.getElementById("from").value.trim(), car: document.getElementById("car").value.trim(), lines: lines(), memo: document.getElementById("memo").value.trim(), at: new Date().toISOString() };
  if(!v.dt) return e.textContent = "보낸 날을 골라 주세요";
  if(!v.from) return e.textContent = "거래처 (보내는 곳) 이름을 적어 주세요";
  if(!v.lines.length) return e.textContent = "품목과 수량을 하나 이상 넣어 주세요";
  if(v.lines.length > 30) return e.textContent = "품목 줄은 30개까지예요";
  if(PHOTO) v.photo = PHOTO;
  var b = document.getElementById("sendBtn"); b.disabled = true; b.textContent = "보내는 중...";
  fbDb.ref("/busePub/" + CFG.season).push(v).then(function(){
    document.getElementById("form").style.display = "none"; document.getElementById("done").style.display = "block";
    document.getElementById("doneTxt").innerHTML = esc(v.dt) + " · " + esc(v.from) + "<br>" + v.lines.map(function(l){ return "<b>" + esc(l.item) + "</b> " + l.qty.toLocaleString("ko-KR") + "개"; }).join(" · ");
  }).catch(function(x){ b.disabled = false; b.textContent = "📨 가문굴비로 보내기"; e.textContent = "못 보냈어요: " + x.message; });
}
document.getElementById("dt").value = today();
fbDb.ref("/busePubCfg").once("value").then(function(s){
  CFG = s.val() || {}; document.getElementById("seasonTxt").textContent = CFG.season ? "(" + CFG.season + " 시즌)" : "";
  document.getElementById("froms").innerHTML = (CFG.froms || []).map(function(f){ return '<option value="' + esc(f) + '">'; }).join("");
  addLine(); addLine(); calc();
}).catch(function(x){ document.getElementById("err").textContent = "불러오기 실패: " + x.message; addLine(); });
</script>
</body>
</html>
